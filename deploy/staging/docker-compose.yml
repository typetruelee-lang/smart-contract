# 굳건 — 외부 모바일 테스트용 임시 서버 (토스 심사 전 테스트)
#   ./start.sh staging   →  https://<임의>.trycloudflare.com  (STAGING.md 참고)
# 개발 모드(Mock 로그인·서명)로 동작하고, 디지털 지문은 OpenTimestamps(무료)로 실제 비트코인에 기록한다.
# 테스터 외 접근을 막기 위해 사이트 전체에 비밀번호(Basic 인증)를 건다.
name: goodgun-staging

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://contract:contract@db:5432/contract
  REDIS_URL: redis://redis:6379/0
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}  # run.sh 가 공개 주소를 .env 에 적는다
  CORS_ORIGINS: ${PUBLIC_BASE_URL}
  COOKIE_SECURE: "true"
  TOSS_PROVIDER: mock
  PAYMENT_PROVIDER: mock
  IDENTITY_PROVIDER: mock
  SIGNATURE_PROVIDER: development
  OCR_PROVIDER: local
  BLOCKCHAIN_PROVIDER: ${STAGING_BLOCKCHAIN:-opentimestamps}
  BLOCKCHAIN_PRICE: "0"
  OTS_POLL_SECONDS: "600"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract
      POSTGRES_DB: contract
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: { context: ../.., dockerfile: backend/Dockerfile, secrets: [extra_ca] }
    command: ["api"]
    environment: *backend-env
    env_file: [.env]
    volumes: [secrets:/data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build: { context: ../.., dockerfile: backend/Dockerfile, secrets: [extra_ca] }
    command: ["worker"]
    environment: *backend-env
    env_file: [.env]
    volumes: [secrets:/data]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: { context: ../.., dockerfile: frontend/Dockerfile, secrets: [extra_ca] }
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/htpasswd:ro
    # 이 컴퓨터에서만 열린다 (외부 공개는 tunnel 이 담당)
    ports: ["127.0.0.1:${STAGING_LOCAL_PORT:-5180}:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # Cloudflare 임시 터널 — 계정 없이 https://<임의>.trycloudflare.com 주소를 발급한다.
  # 컨테이너를 다시 만들면 주소가 바뀐다. 자기 도메인을 쓰면(STAGING_PUBLIC_URL) 실행하지 않는다.
  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    profiles: [tunnel]
    restart: unless-stopped

volumes:
  dbdata:
  secrets:

secrets:
  extra_ca:
    file: ${EXTRA_CA_CERT:-../../.empty-ca.crt}
