<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>계약하자 앱 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽 화면 목록 · 가운데 휴대폰(클릭형 프로토타입) · 오른쪽 화면 설명. 폰 폭에서는 목록이 드롭다운, 휴대폰이 전체 폭 */
:root {
  --ground: #edf1f6; --ink: #191f28; --muted: #6b7684; --line: #d8dee6; --panel: #ffffff;
  --accent: #3182f6; --accent-soft: #e8f3ff; --device: #1b222c;
  /* 앱 화면(토스 팔레트) — 두 테마에서 동일 */
  --app: #ffffff; --app-2: #f2f4f6; --app-3: #f9fafb; --app-ink: #191f28; --app-sub: #6b7684; --app-muted: #8b95a1;
  --app-line: #e5e8eb; --app-blue: #3182f6; --app-blue-soft: #e8f3ff; --app-red: #f04452; --app-green: #0b8a4a; --app-green-soft: #e5f8ee; --app-orange: #d97706; --app-orange-soft: #fff4e5;
  --font-display: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #0f1319; --ink: #e8ecf1; --muted: #98a2ae; --line: #28303a; --panel: #171c24; --accent: #5a9bff; --accent-soft: #1a2f4d; --device: #000; color-scheme: dark; } }
:root[data-theme="dark"] { --ground: #0f1319; --ink: #e8ecf1; --muted: #98a2ae; --line: #28303a; --panel: #171c24; --accent: #5a9bff; --accent-soft: #1a2f4d; --device: #000; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px; margin-bottom: 24px; }
.brand { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 14px; letter-spacing: .03em; }
h1 { font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 34px); line-height: 1.25; margin: 4px 0 6px; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.flowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.pill:hover { border-color: var(--accent); color: var(--accent); }
.stage { display: grid; grid-template-columns: 250px minmax(0, 390px) minmax(0, 1fr); gap: 28px; align-items: start; }
nav.list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px; max-height: calc(100vh - 40px); overflow: auto; }
nav.list h3 { font-size: 12px; color: var(--muted); margin: 12px 10px 4px; letter-spacing: .04em; font-weight: 700; }
nav.list h3:first-child { margin-top: 4px; }
nav.list button { display: flex; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--ink); padding: 7px 10px; border-radius: 10px; cursor: pointer; }
nav.list button b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 22px; }
nav.list button:hover { background: var(--accent-soft); }
nav.list button[aria-current="true"] { background: var(--accent); color: #fff; }
nav.list button[aria-current="true"] b { color: #fff; }
.picker { display: none; }
.phone { width: 100%; max-width: 390px; border-radius: 46px; padding: 11px; background: var(--device); box-shadow: 0 30px 60px -30px rgba(16, 24, 40, .6); }
.screen { position: relative; height: 780px; border-radius: 36px; overflow: hidden; background: var(--app); color: var(--app-ink); font-size: 15px; line-height: 1.55; }
.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.desc { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; }
.desc .grp { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.desc h2 { font-family: var(--font-display); font-size: 22px; margin: 4px 0 8px; text-wrap: balance; }
.desc p { margin: 0 0 10px; color: var(--muted); }
.desc ul { margin: 0; padding-left: 18px; color: var(--ink); }
.desc li + li { margin-top: 4px; }
.navrow { display: flex; gap: 8px; }
.navrow button { flex: 1; font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 10px; cursor: pointer; }
.navrow button:disabled { opacity: .4; cursor: default; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ===== 앱 화면 ===== */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--app); }
.view.enter { animation: slideIn .28s cubic-bezier(.2, .8, .2, 1); }
.view.enter.back { animation-name: slideBack; }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view.enter { animation: none; } }
.sb { height: 38px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 700; }
.hd { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.hd .bk { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: var(--app-ink); cursor: pointer; }
.hd .bk:active { background: var(--app-2); }
.hd h4 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd .rt { font-size: 14px; color: var(--app-sub); padding-right: 12px; }
.bd { flex: 1; overflow: auto; padding: 4px 20px 24px; min-height: 0; }
.bd::-webkit-scrollbar { width: 0; }
.ft { flex: none; padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 8px; background: var(--app); }
.btn { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 16px; padding: 16px; width: 100%; background: var(--app-blue); color: #fff; cursor: pointer; transition: transform .12s ease, filter .12s ease; }
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn.sub { background: var(--app-blue-soft); color: var(--app-blue); }
.btn.grey { background: var(--app-2); color: var(--app-ink); }
.btn.sm { font-size: 15px; padding: 12px; border-radius: 14px; }
.btn:disabled { background: var(--app-2); color: var(--app-muted); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.t1 { font-size: 24px; font-weight: 700; line-height: 1.4; margin: 8px 0 6px; text-wrap: balance; }
.t2 { font-size: 18px; font-weight: 700; margin: 26px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.t2 small { font-size: 13px; font-weight: 400; color: var(--app-muted); }
.sub { color: var(--app-sub); margin: 0; font-size: 15px; }
.muted { color: var(--app-muted); }
.fine { font-size: 12.5px; line-height: 1.6; color: var(--app-muted); margin: 14px 0 0; }
.tap { cursor: pointer; transition: transform .14s ease, background .14s ease; }
.tap:active { transform: scale(.98); }
.cardg { background: var(--app-3); border-radius: 22px; padding: 16px 18px; }
.cardg + .cardg { margin-top: 10px; }
.cardg.tap:active { background: var(--app-2); }
.ico { flex: none; width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; font-size: 23px; }
.lrow { display: flex; align-items: center; gap: 14px; }
.lrow .tx { flex: 1; min-width: 0; }
.lrow b { display: block; font-size: 16.5px; font-weight: 600; }
.lrow small { display: block; font-size: 13.5px; color: var(--app-sub); }
.chev { flex: none; width: 18px; height: 18px; color: #c5ccd4; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qk { background: var(--app-3); border-radius: 22px; padding: 16px; border: 0; text-align: left; font: inherit; color: inherit; }
.qk .ico { width: 42px; height: 42px; font-size: 21px; margin-bottom: 12px; }
.qk b { display: block; font-size: 16px; }
.qk small { color: var(--app-muted); font-size: 12.5px; }
.bundle { border: 1px solid var(--app-line); border-radius: 22px; overflow: hidden; box-shadow: 0 2px 14px rgba(0, 27, 55, .05); }
.bundle .lrow { padding: 14px 16px; }
.bundle .item + .item { border-top: 1px solid var(--app-line); }
.bundle details { padding: 0 16px 14px 76px; margin-top: -6px; }
.bundle summary { list-style: none; cursor: pointer; color: var(--app-blue); font-size: 13px; font-weight: 500; }
.bundle summary::-webkit-details-marker { display: none; }
.bundle details p { margin: 6px 0 0; background: var(--app-3); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; color: var(--app-sub); }
.badge { display: inline-flex; align-items: center; border-radius: 8px; padding: 2px 8px; font-size: 12.5px; font-weight: 700; background: var(--app-2); color: var(--app-sub); white-space: nowrap; }
.badge.blue { background: var(--app-blue-soft); color: var(--app-blue); }
.badge.green { background: var(--app-green-soft); color: var(--app-green); }
.badge.orange { background: var(--app-orange-soft); color: var(--app-orange); }
.badge.red { background: #fff0f1; color: var(--app-red); }
.alertc { background: var(--app-blue-soft); border-radius: 22px; padding: 16px 18px; }
.alertc b { color: var(--app-blue); display: block; }
.fld { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; }
.fld label { display: flex; font-size: 14px; font-weight: 500; color: #4e5968; }
.fld label i { font-style: normal; color: var(--app-red); margin-left: 2px; }
.fld label span { margin-left: auto; font-size: 12px; color: #b0b8c1; font-weight: 400; }
.in { font: inherit; font-size: 16px; width: 100%; border: 1px solid var(--app-line); border-radius: 14px; padding: 12px 14px; background: #fff; color: var(--app-ink); outline: none; }
.in:focus { border-color: var(--app-blue); }
.in.err { border-color: var(--app-red); }
.in:read-only { background: var(--app-3); color: var(--app-sub); }
.errm { color: var(--app-red); font-size: 12.5px; }
textarea.in { min-height: 86px; resize: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--app-2); border-radius: 14px; padding: 4px; margin: 4px 0 14px; }
.seg button { font: inherit; font-size: 14px; font-weight: 700; border: 0; border-radius: 11px; padding: 8px; background: transparent; color: var(--app-muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--app-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 12px; }
.ck { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; font-size: 15px; }
.ck input { position: absolute; opacity: 0; pointer-events: none; }
.ck .box { flex: none; width: 24px; height: 24px; border-radius: 8px; background: var(--app-2); display: grid; place-items: center; color: transparent; font-size: 14px; font-weight: 700; transition: background .15s ease; margin-top: 1px; }
.ck input:checked + .box { background: var(--app-blue); color: #fff; }
.ck input:focus-visible + .box { outline: 3px solid var(--app-blue); outline-offset: 2px; }
.pad { position: relative; border: 1.5px dashed #c5ccd4; border-radius: 20px; height: 190px; background: #fff; touch-action: none; }
.pad canvas { width: 100%; height: 100%; display: block; border-radius: 20px; cursor: crosshair; }
.pad .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #b0b8c1; pointer-events: none; font-size: 15px; }
.pad .clr { position: absolute; right: 10px; bottom: 8px; font: inherit; font-size: 13px; border: 0; background: var(--app-2); border-radius: 10px; padding: 4px 10px; color: var(--app-sub); cursor: pointer; }
.paperw { background: var(--app-2); border-radius: 18px; padding: 12px; }
.paper { background: #fff; border-radius: 6px; padding: 20px 16px 14px; font-size: 10.8px; line-height: 1.8; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); color: #1b1f24; }
.paper .no { text-align: right; color: #8b95a1; font-size: 8.5px; }
.paper h5 { font-size: 15px; text-align: center; margin: 4px 0 12px; }
.paper p { margin: 0; white-space: pre-wrap; }
.paper .v { font-weight: 700; border-bottom: 1.3px solid #1b64da; padding: 0 1px; }
.paper .foot { margin-top: 12px; padding-top: 6px; border-top: 1px solid #e5e8eb; font-size: 8px; color: #8b95a1; display: flex; justify-content: space-between; }
.paper .sig { display: inline-block; vertical-align: -4px; }
.paper .sig svg { width: 60px; height: 20px; display: block; }
.paper .sig.empty { border-bottom: 1px dashed #b0b8c1; color: #8b95a1; font-size: 8.5px; vertical-align: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
.kv dt { color: var(--app-muted); }
.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.states div { background: var(--app-3); border-radius: 16px; padding: 12px 8px; text-align: center; font-size: 12px; color: var(--app-muted); }
.states b { display: block; color: var(--app-ink); font-size: 13px; margin-bottom: 4px; }
.done-mark { width: 72px; height: 72px; border-radius: 50%; background: var(--app-blue); color: #fff; display: grid; place-items: center; margin: 20px auto 0; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
.done-mark.green { background: var(--app-green); }
.done-mark.red { background: var(--app-red); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .done-mark { animation: none; } }
.center { text-align: center; }
.infob { background: var(--app-3); border-radius: 18px; padding: 14px 16px; font-size: 13px; color: var(--app-sub); }
.infob strong { display: block; color: var(--app-ink); margin-bottom: 4px; font-size: 14px; }
.infob ul { margin: 0; padding-left: 16px; }
.infob + .infob { margin-top: 10px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 16px 22px; font-size: 14px; }
.tl li::before { content: ""; position: absolute; left: 4px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--app-blue); }
.tl li::after { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 1px; background: var(--app-line); }
.tl li:last-child::after { display: none; }
.tl small { display: block; color: var(--app-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); display: flex; align-items: flex-end; z-index: 5; animation: fade .2s ease; }
.sheet { width: 100%; background: #fff; border-radius: 26px 26px 0 0; padding: 12px 20px 26px; animation: up .28s cubic-bezier(.2, .8, .2, 1); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--app-line); margin: 0 auto 14px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.toast { position: absolute; left: 20px; right: 20px; bottom: 110px; background: rgba(25, 31, 40, .92); color: #fff; border-radius: 14px; padding: 12px 16px; font-size: 14px; z-index: 9; animation: up .25s ease; }
.drop { border: 1.5px dashed #c5ccd4; border-radius: 22px; padding: 28px 16px; text-align: center; color: var(--app-sub); }
.sug { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--app-line); font-size: 14px; }
.sug:first-child { border-top: 0; }
.sug .tx { flex: 1; min-width: 0; }
.sug small { display: block; color: var(--app-muted); font-size: 12px; }
.pdfpage { position: relative; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); aspect-ratio: 1 / 1.414; max-width: 100%; overflow: hidden; font-size: 9px; color: #333; padding: 18px 16px; line-height: 2.1; }
.pdfpage .box { position: absolute; border: 2px solid var(--app-blue); background: rgba(49, 130, 246, .12); border-radius: 4px; font-size: 9px; color: var(--app-blue); font-weight: 700; padding: 0 4px; line-height: 1.6; }
.pdfpage .box.sel { box-shadow: 0 0 0 3px rgba(49, 130, 246, .25); }
.qr { width: 74px; height: 74px; flex: none; background:
  conic-gradient(from 90deg at 30% 30%, #191f28 25%, transparent 0) 0 0 / 14px 14px, #fff; border: 5px solid #191f28; border-radius: 6px; }

.clbox { margin-top: 18px; border: 1px solid var(--app-line); border-radius: 22px; box-shadow: 0 2px 14px rgba(0, 27, 55, .05); overflow: hidden; }
.cl-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 0; background: #fff; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.cl-head .tx { flex: 1; min-width: 0; }
.cl-head b { display: block; font-size: 16px; }
.cl-head small { display: block; color: var(--app-muted); font-size: 13px; }
.cl-caret { color: var(--app-muted); font-size: 18px; transition: transform .2s ease; }
.cl-caret.up { transform: rotate(180deg); }
.cl-body { border-top: 1px solid var(--app-line); padding: 4px 16px 16px; }
.cl-note { margin: 10px 0 4px; background: var(--app-3); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; color: var(--app-sub); }
.cl-sub { margin: 14px 0 2px; font-size: 12.5px; font-weight: 700; color: var(--app-muted); }
.cl-item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--app-line); }
.cl-sub + .cl-item { border-top: 0; }
.cl-item .tx { flex: 1; min-width: 0; }
.cl-item b { display: block; font-size: 15px; }
.cl-item small { display: block; font-size: 12.5px; color: var(--app-sub); line-height: 1.5; margin-top: 2px; }
.cl-warn { display: inline-block; font-style: normal; margin-top: 6px; background: var(--app-orange-soft); color: #b45309; border-radius: 8px; padding: 3px 8px; font-size: 11.5px; line-height: 1.45; }
.sw { position: relative; flex: none; width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--app-line); cursor: pointer; transition: background .2s ease; }
.sw span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s ease; }
.sw.on { background: var(--app-blue); }
.sw.on span { transform: translateX(20px); }
.cl-custom { display: flex; gap: 8px; align-items: flex-start; background: var(--app-3); border-radius: 14px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }
.cl-custom span { flex: 1; min-width: 0; }
.cl-custom button { border: 0; background: transparent; color: var(--app-muted); font: inherit; font-size: 13px; cursor: pointer; }
@media (max-width: 1040px) {
  .stage { grid-template-columns: minmax(0, 390px) minmax(0, 1fr); }
  nav.list { display: none; }
  .picker { display: block; grid-column: 1 / -1; }
}
@media (max-width: 720px) {
  .wrap { padding-inline: 16px; padding-block: 18px 40px; }
  .stage { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .phone { margin: 0 auto; border-radius: 40px; padding: 8px; }
  .screen { height: 720px; border-radius: 32px; }
  .aside { position: static; }
}
.picker select { width: 100%; font: inherit; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">계약하자 · 앱 목업</div>
      <h1>계약서는 내가 보관하고, 지문은 검증할 수 있게</h1>
      <p class="lede">휴대폰 화면 안의 버튼을 눌러 실제 앱처럼 둘러보세요. 입력칸에 글을 쓰고 서명패드에 서명할 수도 있습니다. 이름·금액은 모두 예시입니다.</p>
    </div>

  var ORDER = SCREENS.map(function (s) { return s.id; });

  function toast(msg) {

  function setupPad(root) {
    var c = root.querySelector("#pad"), hint = root.querySelector("#pad-hint"), btn = root.querySelector("#sign-btn");
    var ctx = c.getContext("2d"), drawing = false, has = false;
    function size() { var r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#191f28"; }
    requestAnimationFrame(size);
    function pt(e) { var r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    function update() { var ok = has && root.querySelectorAll("[data-chk]:checked").length === 4; btn.disabled = !ok; }

    c.addEventListener("pointermove", function (e) { if (!drawing) return; var p = pt(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); if (!has) { has = true; hint.hidden = true; update(); } });
    c.addEventListener("pointerup", function () { drawing = false; });
    root.querySelector("#pad-clear").addEventListener("click", function () { ctx.clearRect(0, 0, c.width, c.height); has = false; hint.hidden = false; update(); });

  screenEl.addEventListener("input", function (e) {
    var f = e.target.getAttribute && e.target.getAttribute("data-f");
