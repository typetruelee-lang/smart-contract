# 계약 종류별 원본 보존 정책
# - draft_ttl_days            : 완료되지 않은 계약(초안/서명 대기)의 원문을 보관하는 최대 기간
# - post_completion_ttl_days  : 계약 완료 후 당사자가 PDF 를 내려받을 수 있도록 암호화 보관하는 기간
# - keep_encrypted_original   : true 면 사용자가 요청한 경우 완료 후에도 암호화 원본을 보관 (법적 보존의무 대응용 옵션)
# - legal_basis_note          : 사용자에게 보여줄 안내 문구 (최종 문구는 법률 검토 필요)
# 영구 보관: 메타데이터, 디지털 지문(Hash), 감사 로그, 서명 상태, 검증 ID, 블록체인·결제 기록 (개인정보 제외)
default:
  draft_ttl_days: 30
  post_completion_ttl_days: 7
  keep_encrypted_original: false
  legal_basis_note: "계약서 원본은 완료 후 7일간만 암호화 보관되고 자동 삭제됩니다. PDF 를 내려받아 직접 보관해 주세요."
policies:
  general: {}
  loan: {}
  service: {}
  goods:
    legal_basis_note: "사업자 간 거래는 세법 등에 따라 증빙 보관 의무가 있을 수 있어요. PDF 를 내려받아 보관해 주세요."
  employment:
    post_completion_ttl_days: 7
    keep_encrypted_original: false
    allow_extended_retention: true
    extended_retention_days: 1095
    legal_basis_note: "근로기준법상 사업주는 근로계약서를 3년간 보존해야 해요. 사업주는 PDF 를 반드시 내려받아 보관해 주세요."
